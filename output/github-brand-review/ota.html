 <style>:root {
  --page-title: clamp(2.5rem, 4.3vw, 4rem);

  --title-large: clamp(2.5rem,4.3vw,4rem);
  --title-small: clamp(2.3rem,3.7vw,3.5rem);

/* Product presentation uses black; support pages retain the graphite defaults. */
:root.product-theme {
  --bg: #000000;
  --bg-2: #000000;
}

@font-face {
  font-family: "Quantify RM";
    src: url("https://rminte.com/assets/fonts/Quantify-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
}

/* Service pages share this compact brand shell; homepage layout remains independent. */
.brand-page {margin:0; min-width:320px; background:var(--bg); color:var(--ink); font:16px/1.65 var(--font-ui); -webkit-font-smoothing:antialiased; color-scheme:dark}
.brand-page * {box-sizing:border-box}
.brand-page a {color:inherit;text-decoration:none}
:where(.brand-page) button,:where(.brand-page) input,:where(.brand-page) select {font:inherit}
.brand-page :focus-visible {outline:2px solid var(--accent);outline-offset:4px}
.brand-page button {cursor:pointer}
.brand-page button:disabled {opacity:.4;cursor:not-allowed}
.brand-header {display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;max-width:var(--section-w);margin:24px auto 0;width:calc(100% - var(--section-x)*2);min-height:48px;position:relative;z-index:20}
.brand-logo {display:flex;align-items:center;width:142px}
.brand-logo img,.brand-logo svg {display:block;width:100%;height:auto}
.brand-nav {display:flex;gap:6px;padding:4px 10px;border-radius:var(--radius-button);background:var(--bg-2);box-shadow:inset 0 0 0 1px var(--line)}
.brand-nav a {padding:10px 17px;font-size:12px;border-radius:var(--radius-button);color:var(--muted);white-space:nowrap}
.brand-nav a:hover {background:var(--panel-strong);color:var(--ink)}
.brand-actions {display:flex;gap:8px;align-items:center;justify-self:end}
.brand-button {display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;min-height:48px;border:1px solid var(--line);border-radius:var(--radius-button);background:var(--panel);color:var(--ink);font-size:13px;line-height:1.3;text-decoration:none;transition:background .2s,border-color .2s}
.brand-button:hover {background:var(--panel-strong);border-color:var(--line-strong)}
.brand-button.primary {background:var(--accent);color:var(--bg);border-color:transparent}
.brand-button.primary:hover {background:#fff}
.brand-language,.brand-menu {height:44px;min-width:56px;border:0;border-radius:var(--radius-button);background:rgba(25,28,31,.82);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:var(--ink);font-size:11px;font-weight:500;backdrop-filter:blur(24px);transition:transform 560ms var(--motion),background 560ms var(--motion)}
.brand-language {padding:0 14px}
button.brand-language {width:56px;padding:0}
.brand-menu {display:none;position:relative;width:56px;padding:0;flex-shrink:0}
.brand-menu span {position:absolute;top:50%;left:calc(50% - 10px);width:20px;height:1px;background:currentColor;transform-origin:center;transition:transform 620ms var(--motion)}
.brand-menu span:first-child {transform:translateY(-4px)}
.brand-menu span:last-child {transform:translateY(4px)}
.brand-menu[aria-expanded="true"] span:first-child {transform:rotate(45deg)}
.brand-menu[aria-expanded="true"] span:last-child {transform:rotate(-45deg)}
.brand-language:hover,.brand-menu:hover {transform:translateY(-1px);background:rgba(255,255,255,.1)}
.brand-footer {max-width:var(--section-w);width:calc(100% - var(--section-x)*2);margin:64px auto 0;padding:32px 0 48px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:24px;color:var(--muted);font-size:12px}
.brand-footer-links {display:flex;flex-wrap:wrap;gap:10px}
.brand-kicker {font-size:11px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
@media(max-width:1120px){.brand-header{grid-template-columns:1fr auto}.brand-menu{display:block}.brand-nav{display:none;position:absolute;top:64px;right:0;left:0;padding:16px;background:var(--panel);border-radius:var(--radius-panel);flex-wrap:wrap;box-shadow:0 20px 40px #0008}.brand-nav.is-open{display:flex}.brand-nav a{font-size:15px;min-height:44px}.brand-actions{grid-column:2;grid-row:1}}
@media(max-width:520px){.brand-header{margin-top:16px;gap:12px}.brand-logo{width:118px}.brand-footer{align-items:flex-start;flex-direction:column}.brand-footer-links{width:100%}.brand-button{padding:12px 18px}}
@media(prefers-reduced-motion:reduce){.brand-page *{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

 const langToggle=document.getElementById('langToggle'),copyButton=document.getElementById('copyButton'),feedback=document.getElementById('copyFeedback');
 function applyLanguage(lang,remember=true){currentLang=lang;if(remember)localStorage.setItem('rm-ota-lang',lang);document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=translations[lang][el.dataset.i18n]);document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=translations[lang][el.dataset.i18nHtml]);document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',translations[lang][el.dataset.i18nAria]));langToggle.textContent=lang==='zh'?'EN':'中文';langToggle.setAttribute('aria-label',lang==='zh'?'切换到英文':'Switch to Chinese');feedback.textContent='';}
 langToggle.addEventListener('click',()=>applyLanguage(currentLang==='zh'?'en':'zh'));
 copyButton.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(document.getElementById('serviceUrl').textContent);feedback.textContent=translations[currentLang].copied;}catch{feedback.textContent=translations[currentLang].copyFailed;}});
 const menu=document.getElementById('brandMenu'),nav=document.getElementById('brandNav');
 function closeMenu(){nav.classList.remove('is-open');menu.setAttribute('aria-expanded','false');}
 menu.addEventListener('click',()=>{const open=nav.classList.toggle('is-open');menu.setAttribute('aria-expanded',String(open));});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&nav.classList.contains('is-open')){closeMenu();menu.focus();}});document.addEventListener('click',e=>{if(!e.target.closest('.brand-header'))closeMenu();});
 applyLanguage(currentLang,false);
