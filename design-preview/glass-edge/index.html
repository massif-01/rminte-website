<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>绒光玻璃 · 边缘衔接对照</title>
<link rel="stylesheet" href="/website/assets/brand.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#141618;color:#e5e7e8;font-family:var(--font-ui);padding:32px}header{max-width:1440px;margin:auto}h1{font-size:28px;font-weight:500;margin:8px 0 12px}p{font-size:14px;line-height:1.8;color:#a9adb2;margin:0 0 18px}.controls{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;margin:24px 0}label{display:flex;gap:10px;align-items:center;font-size:13px}select,button{font:inherit;background:#24282c;color:#e5e7e8;border:1px solid #45494c;border-radius:24px;padding:9px 14px}input{accent-color:#ddd;width:130px}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:4px}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:1440px;margin:auto}.comparison.single{grid-template-columns:minmax(0,1fr)}.single article[hidden]{display:none}article{min-width:0}h2{font-size:15px;font-weight:500;margin:0 0 12px}h2 span{color:#a9adb2;font-weight:400;margin-left:8px}.frame{position:relative;overflow:hidden;background:#000;margin:auto;max-width:100%}iframe{position:absolute;left:0;top:0;border:0;transform-origin:top left;background:#000}footer{max-width:1440px;margin:20px auto;font-size:13px;line-height:1.8;color:#a9adb2}@media(max-width:600px){body{padding:20px 14px}h1{font-size:24px}.comparison{gap:12px}h2 span{display:block;margin:5px 0 0;font-size:12px}}
</style></head>
<body><header><p>独立对照 / 正式源码已采用 28% 渐隐</p><h1>绒光玻璃 · 边缘衔接对照</h1><p>两版使用相同照片、主体大小、位置、亮度和文案。B 版只让图片左侧逐渐融入黑色。重点看：衔接是否更自然，玻璃与机身的边缘是否还清楚。</p>
<div class="controls"><label>画幅<select id="size"><option value="393,852">手机 · 393 × 852</option><option value="768,1024">平板 · 768 × 1024</option><option value="1440,900">桌面 · 1440 × 900</option></select></label><label>查看<select id="layout"><option value="both">并排对照</option><option value="a">只看 A · 原版</option><option value="b">只看 B · 渐隐版</option></select></label><label>B 渐隐范围<input id="fade" type="range" min="4" max="28" value="28" step="1"><output id="value">28%</output></label><label>语言<select id="lang"><option value="zh-CN">中文</option><option value="en">English</option></select></label><button id="reset">恢复初始对照</button></div></header>
<main class="comparison"><article id="a"><h2>A <span>当前构图</span></h2><div class="frame"><iframe title="A 当前构图" src="scene.html?variant=a"></iframe></div></article><article id="b"><h2>B <span>左侧渐隐衔接</span></h2><div class="frame"><iframe title="B 左侧渐隐衔接" src="scene.html?variant=b"></iframe></div></article></main>
<footer>渐隐范围越大，衔接越柔和，也越可能淡化机身边缘。它不会补出原图以外的内容。切换「只看 A / B」可以在同一位置比较，桌面画幅会等比例缩放以完整显示。</footer>
<script src="preview.js"></script></body></html>
