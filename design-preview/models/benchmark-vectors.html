<!doctype html><html lang="zh-CN" class="product-theme"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>模型评测 · SVG 构成方案</title><link rel="stylesheet" href="../../website/assets/brand.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:var(--ink);font-family:var(--font-ui,Geist,"Noto Sans SC",sans-serif)}main{max-width:1280px;margin:auto;padding:40px clamp(24px,5vw,80px) 60px}.review{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:32px;border-bottom:1px solid var(--line)}.review p{margin:0;color:var(--muted);font-size:13px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choices button{font:inherit;font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:11px 18px;cursor:pointer}.choices button[aria-selected=true]{background:var(--ink);color:#141618;border-color:var(--ink)}button:focus-visible{outline:2px solid white;outline-offset:4px}section{padding-top:64px}h1{margin:0;font-size:clamp(32px,4vw,50px);font-weight:500;line-height:1.25;letter-spacing:-.035em}figure{margin:20px 0 0}figure img{display:block;width:100%;height:auto;aspect-ratio:960/420;object-fit:contain}figcaption{text-align:center;color:var(--dim);font-size:14px;margin-top:10px;line-height:1.8}.note{display:flex;justify-content:space-between;gap:28px;margin-top:64px;padding-top:24px;border-top:1px solid var(--line)}.note p{margin:0;font-size:14px;line-height:1.8;color:var(--muted)}.note strong{display:block;font-weight:500;color:var(--ink);margin-bottom:6px}.note a{flex-shrink:0;align-self:flex-start;font-size:13px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:4px}@media(max-width:600px){main{padding-top:24px}.review{align-items:flex-start;flex-direction:column;gap:16px;padding-bottom:24px}.choices{gap:6px}.choices button{font-size:12px;padding:10px 12px}section{padding-top:40px}figure{margin-top:36px}figure img{width:calc(100% + 32px);max-width:none;margin-left:-16px}figcaption{font-size:12px;margin-top:28px}.note{margin-top:44px;gap:20px}.note p{font-size:13px}.note a{font-size:12px}}
</style></head><body><main><div class="review"><p>SVG 构成方案</p><div class="choices" role="tablist" aria-label="图形方案"><button role="tab" id="tab-0" aria-controls="concept" aria-selected="true" tabindex="0" data-choice="0">01 光的截面</button><button role="tab" id="tab-1" aria-controls="concept" aria-selected="false" tabindex="-1" data-choice="1">02 推理的收敛</button><button role="tab" id="tab-2" aria-controls="concept" aria-selected="false" tabindex="-1" data-choice="2">03 验证之环</button></div></div><section id="concept" role="tabpanel" aria-labelledby="tab-0"><h1>模型评测</h1><figure><img id="art" src="benchmark-vector-01.svg" alt="光的截面：连续线场与三个观察截面"><figcaption>测评结果即将推出</figcaption></figure><div class="note"><p><strong id="name">01 · 光的截面</strong><span id="description">连续线场穿过平行截面，以线密度、遮挡和明暗建立空间。</span></p><a id="source" href="benchmark-vector-01.svg" target="_blank" rel="noopener">打开 SVG</a></div></section></main><script>
const variants=[['光的截面','连续线场穿过平行截面，以线密度、遮挡和明暗建立空间。'],['推理的收敛','三组曲线从不同方向归入有序路径，强调节奏与连续性。'],['验证之环','重复轮廓形成圆环，与一条平面带交错，构成统一的检验尺度。']];
const tabs=[...document.querySelectorAll('[data-choice]')];
function select(index){tabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===index));tab.tabIndex=i===index?0:-1});const src=`benchmark-vector-0${index+1}.svg`;document.getElementById('art').src=src;document.getElementById('art').alt=variants[index][0];document.getElementById('name').textContent=`0${index+1} · ${variants[index][0]}`;document.getElementById('description').textContent=variants[index][1];document.getElementById('source').href=src;document.getElementById('concept').setAttribute('aria-labelledby',`tab-${index}`)}
tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>select(index));tab.addEventListener('keydown',event=>{let next;if(event.key==='ArrowRight')next=(index+1)%tabs.length;else if(event.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else return;event.preventDefault();select(next);tabs[next].focus()})});
</script></body></html>
