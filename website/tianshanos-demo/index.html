<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
  <title>TianshanOS 0.6.4 · Interface demo</title>
  <link rel="icon" href="../assets/images/favicon.svg">
  <style>
    html{scrollbar-gutter:stable}body{margin:0;background:#cddbe7;font:14px/1.6 system-ui,sans-serif;color:#1d1d1f}body.has-demo-dialog{overflow:hidden}
    #demo-viewport{width:100%;max-width:1440px;margin:auto;overflow:hidden}iframe{display:block;border:0}
    #mobile-message{display:none;margin:24px;padding:24px;border:1px solid #ffffff80;border-radius:16px;background:#ffffff80}
    @media(max-width:600px){#demo-viewport{display:none}#mobile-message{display:block}}
  </style>
  <script src="assets/viewer.js" type="module"></script>
</head>
<body>
  <div id="demo-viewport"><iframe id="demo-preview" title="TianshanOS 0.6.4 desktop interface demo"></iframe></div>
  <p id="mobile-message"></p>
  <noscript>Enable JavaScript to view this demo.</noscript>
</body>
</html>
